# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://redbagel.github.io
date_format: "ordinal"
title: 温盈
subtitle: ""
description: "温盈的个人博客"
keywords: 
timezone: Asia/Shanghai
encoding: "utf-8"
# 页面左下角显示的年份
since: 2026
# 源码仓库，请替换成自己的
repository: RedBagel/RedBagel.github.io
# 对 css 和 js 资源的 cdn 加速配置
cdn:
    jsdelivr:
        enabled: false
# 可选组件配置
components:
    # 分享
    # weibo,qq,wechat,douban,qzone,linkedin,facebook,twitter
    share:
        enabled: false
        hide-platforms: weibo,douban,qzone,linkedin,facebook,twitter
    # 不蒜子访问统计
    busuanzi:
        enabled: false
        start_date: 2023-08-29
    # My Popular Repositories
    side_bar_repo:
        enabled: true
        limit: 5
    # 文章字数统计
    word_count:
        enabled: true
    # 页面右上角，以及「关于」页面的二维码
    # 修改图片请替换 assets/images/qrcode.jpg
    qrcode:
        enabled: true
        image_alt: wushui
    # 维基索引页使用哪种视图，支持 列表（list）/分类（cate）
    wiki:
        view: cate
    # 图片灯箱效果功能
    fancybox:
        enabled: false
# 压缩页面内容
compress_html:
  clippings: all
  comments: ["<!--", "-->"]
# 代码高亮风格，支持的 theme 列表见 https://github.com/mzlogin/rouge-themes
highlight_theme: github

# ---------------- #
#      Author      #
# ---------------- #
author: Wen Ying
organization: 
organization_url: 
github_username: RedBagel
github_username_url: https://github.com/RedBagel
location: ChenDu, China
email: tinotino@foxmail.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页
  -
    href: /archives/
    label: 归档
  -
    href: /categories/
    label: 分类
  -
    href: /links/
    label: 友链
  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-github-metadata
    - rouge
#     - jekyll-html-pipeline
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
#     - jekyll-mentions

# ---------------- #
#      Comments    #
# ---------------- #
# support provider: disqus, gitment, gitalk, utterances, beaudar, giscus
comments_provider: giscus
# !!!重要!!! 请修改下面这些信息为你自己申请的
# !!!Important!!! Please modify infos below to yours

giscus:
    repo: RedBagel/RedBagel.github.io
    repo-id: R_kgDOUEIucA
    category: Announcements
    category-id: DIC_kwDOUEIucM4DELix
    light: light
# 在使用其它评论组件时可点击显示 Disqus
lazy_load_disqus : false

# ---------------- #
#      Google      #
# ---------------- #
google:
    analytics_id: # G-20FLEG5Q2W
    adsense:
        enabled: false
        footer: false
        sidebar: false
        sidebar-detail: false
        content_header: false
        content_footer: false

# 允许未来日期的 post 也参与构建（避免时区/时间错配被跳过）
future: true
